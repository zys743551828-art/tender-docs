x="309" y="686" font-size="13" fill="#101828" font-weight="400">完整评审报告</text><rect x="484" y="668" width="150" height="36" rx="7" fill="white" stroke="#E4E7EC"/><text x="497" y="686" font-size="13" fill="#101828" font-weight="400">响应矩阵</text><rect x="648" y="668" width="160" height="36" rx="7" fill="white" stroke="#E4E7EC"/><text x="661" y="686" font-size="13" fill="#101828" font-weight="400">原文与证据</text><rect x="822" y="668" width="160" height="36" rx="7" fill="white" stroke="#E4E7EC"/><text x="835" y="686" font-size="13" fill="#101828" font-weight="400">Word 报告</text><rect x="996" y="668" width="160" height="36" rx="7" fill="white" stroke="#E4E7EC"/><text x="1009" y="686" font-size="13" fill="#101828" font-weight="400">批注 PDF</text><rect x="272" y="756" width="1144" height="144" rx="10" fill="white" stroke="#E4E7EC"/><text x="296" y="787" font-size="15" fill="#101828" font-weight="600">直接问当前项目</text><text x="296" y="828" font-size="13" fill="#667085" font-weight="400">先改哪一项？  ·  帮我解释这条要求  ·  找一份适用的措施参考</text><text x="296" y="875" font-size="12" fill="#667085" font-weight="400">＋ 上传资料     @ 选参考       本项目会话与工作区共用同一套记录</text><rect x="1360" y="848" width="32" height="32" rx="7" fill="#155EEF"/><text x="1371" y="865" font-size="18" fill="white" font-weight="400">↑</text><text x="272" y="935" font-size="12" fill="#667085" font-weight="400">有稿直接查 → 需要时进入对应章节改稿 → 生成或上传新稿复检 → 登记实交稿</text><text x="272" y="974" font-size="11" fill="#667085" font-weight="400">融合版目标示意 · 项目、问题、页码、数量与状态均为虚构 · 非运行软件</text></svg>