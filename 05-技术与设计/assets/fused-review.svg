<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>text{font-family:Inter,"Noto Sans CJK SC",sans-serif;dominant-baseline:middle} .label{font-size:13px;fill:#101828}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="64" height="1000" rx="0" fill="#FAFAFA"/><rect x="20" y="25" width="28" height="28" rx="8" fill="#155EEF"/><text x="28" y="39" font-size="18" fill="white" font-weight="600">T</text><rect x="12" y="103" width="40" height="38" rx="7" fill="#EFF4FF"/><text x="23" y="122" font-size="12" fill="#155EEF" font-weight="400">投</text><rect x="12" y="154" width="40" height="38" rx="7" fill="#FAFAFA"/><text x="23" y="173" font-size="12" fill="#667085" font-weight="400">历</text><rect x="12" y="205" width="40" height="38" rx="7" fill="#FAFAFA"/><text x="23" y="224" font-size="12" fill="#667085" font-weight="400">知</text><rect x="12" y="256" width="40" height="38" rx="7" fill="#FAFAFA"/><text x="23" y="275" font-size="12" fill="#667085" font-weight="400">AI</text><rect x="12" y="307" width="40" height="38" rx="7" fill="#FAFAFA"/><text x="23" y="326" font-size="12" fill="#667085" font-weight="400">任</text><rect x="12" y="358" width="40" height="38" rx="7" fill="#FAFAFA"/><text x="23" y="377" font-size="12" fill="#667085" font-weight="400">库</text><rect x="12" y="409" width="40" height="38" rx="7" fill="#FAFAFA"/><text x="23" y="428" font-size="12" fill="#667085" font-weight="400">复</text><rect x="64" y="0" width="184" height="1000" rx="0" fill="white"/><path d="M248 0L248 1000" stroke="#E4E7EC"/><text x="84" y="38" font-size="13" fill="#667085" font-weight="400">‹  投标项目</text><text x="84" y="88" font-size="16" fill="#101828" font-weight="600">临港大道工程</text><text x="84" y="115" font-size="11" fill="#667085" font-weight="400">01 标段 · 编制评审</text><text x="94" y="168" font-size="13" fill="#101828" font-weight="400">概览</text><text x="94" y="211" font-size="13" fill="#101828" font-weight="400">招标资料</text><text x="94" y="254" font-size="13" fill="#101828" font-weight="400">响应矩阵</text><text x="94" y="297" font-size="13" fill="#101828" font-weight="400">章节编制</text><rect x="76" y="323" width="160" height="34" rx="6" fill="#EFF4FF"/><text x="94" y="340" font-size="13" fill="#155EEF" font-weight="600">评审与评分</text><text x="94" y="383" font-size="13" fill="#101828" font-weight="400">版本与导出</text><text x="94" y="426" font-size="13" fill="#101828" font-weight="400">提交与结果</text><path d="M84 497H228" stroke="#E4E7EC"/><text x="94" y="529" font-size="12" fill="#667085" font-weight="400">参考资料与事实</text><text x="94" y="568" font-size="12" fill="#667085" font-weight="400">报价</text><text x="94" y="607" font-size="12" fill="#667085" font-weight="400">项目设置</text><text x="84" y="946" font-size="10" fill="#667085" font-weight="400">可在原有 Word 中改稿</text><rect x="248" y="0" width="1192" height="62" rx="0" fill="white"/><path d="M248 62H1440" stroke="#E4E7EC"/><text x="272" y="31" font-size="13" fill="#667085" font-weight="400">临港大道道路与排水工程 / 评审与评分</text><text x="272" y="103" font-size="24" fill="#101828" font-weight="600">评审结果</text><text x="272" y="135" font-size="12" fill="#667085" font-weight="400">已评审 V2 · 招标文件与补遗 1 · 当前资料未更新</text><rect x="1222" y="91" width="194" height="36" rx="7" fill="white" stroke="#E4E7EC"/><text x="1235" y="109" font-size="13" fill="#101828" font-weight="400">上传新版复评</text><rect x="272" y="168" width="1144" height="150" rx="10" fill="white" stroke="#E4E7EC"/><rect x="272" y="168" width="5" height="150" rx="2" fill="#D92D20"/><rect x="296" y="189" width="160" height="26" rx="6" fill="#FEF3F2"/><text x="305" y="202" font-size="12" fill="#B42318" font-weight="400">关键问题 · 待复核</text><text x="296" y="246" font-size="23" fill="#101828" font-weight="600">有 2 项关键问题需要处理</text><text x="296" y="284" font-size="13" fill="#667085" font-weight="400">先核对工期冲突；其他待办可随后展开，完整报告始终保留。</text><rect x="1176" y="229" width="216" height="36" rx="7" fill="#155EEF"/><text 